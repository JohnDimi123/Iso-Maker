<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Iso Maker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <div id="app">
      <!-- Menu bar (File / View / Mode / Tools / Help) -->
      <nav id="menubar"></nav>

      <main id="main">
        <div id="breadcrumb"></div>
        <section id="content"></section>

        <section id="progress-area">
          <div class="progress-row">
            <span id="progress-phase" class="badge">idle</span>
            <div class="progress-track"><div id="progress-fill"></div></div>
            <span id="progress-pct" class="mono">0%</span>
          </div>
          <div class="progress-meta">
            <span id="progress-speed" class="mono">0.00 MB/s</span>
            <span id="progress-eta" class="mono">ETA --:--</span>
            <span id="progress-buffer" class="mono">buffer --%</span>
            <canvas id="speed-graph" width="320" height="40"></canvas>
          </div>
        </section>
      </main>

      <section id="console">
        <div class="console-head">
          <span>Operation log</span>
          <button id="clear-log" class="ghost-btn">Clear</button>
        </div>
        <div id="log-list"></div>
      </section>

      <div id="statusbar"><span id="status-text">Ready</span></div>
    </div>

    <!-- Modal host (Settings / About) -->
    <div id="modal-overlay" hidden><div id="modal"></div></div>

    <script src="renderer.js"></script>
  </body>
</html>
