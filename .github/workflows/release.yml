name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Windows setup (.exe)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          # Code signing (optional). Add these repo secrets to sign automatically:
          #   WINDOWS_CERT_BASE64   = base64 of your code-signing .pfx
          #   WINDOWS_CERT_PASSWORD = the .pfx password
          # When unset, electron-builder produces an UNSIGNED build (current behaviour),
          # which Windows SmartScreen warns about and Smart App Control blocks.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: List build output
        shell: bash
        run: ls -la release || dir release

      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IsoMaker-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # On tag pushes use the pushed tag; on manual runs use the input.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Iso Maker ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          body: |
            Iso Maker — Windows setup installer.

            Built by the Release workflow with electron-builder (NSIS).
            See the README for the full feature list and status.
          files: release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
